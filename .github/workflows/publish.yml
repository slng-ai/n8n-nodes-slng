# Publishes this n8n community node package after changes land on main.
#
# Release versioning follows Conventional Commit semantics, matching the
# gateway-specs release process:
#   - feat: minor
#   - BREAKING CHANGE / !: major
#   - fix, perf, refactor, docs, chore, ci, test, style, build: patch
#
# The first release should be bootstrapped by creating/pushing v0.1.0 from the
# commit that contains package.json version 0.1.0. After that, semantic-release
# calculates the next version from commits since the latest v* tag.
#
# NPM publishing:
#   Preferred: npm Trusted Publishing with GitHub OIDC. Configure npmjs.com with
#   this repository and workflow file, and leave NPM_TOKEN unset.
#
#   Fallback: set an NPM_TOKEN repository secret with publish access. The
#   workflow writes it to npm config before semantic-release runs.

name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Release to npm and GitHub
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run build check
        run: npm run build

      - name: Configure npm token fallback
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
